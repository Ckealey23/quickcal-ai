<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QuickCalAI</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="card">
      <h1>QuickCalAI</h1>
      <p id="lead" class="lead">Connect Google Calendar to start adding events from any webpage.</p>
      <p id="status" class="status connecting" role="status" aria-live="polite">
        Checking your QuickCal connection…
      </p>
      <p id="detail" class="detail" hidden></p>
      <button id="connect" type="button" disabled>Connect Google Calendar</button>
      <button id="disconnect" type="button" hidden disabled>Disconnect</button>
      <section id="ready" hidden>
        <h2>How to open QuickCalAI</h2>
        <p>Click the QuickCalAI icon in the Chrome toolbar. On a normal webpage, type an event and press Enter.</p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
