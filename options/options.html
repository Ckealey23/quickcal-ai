<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QuickCalAI</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="card">
      <h1>QuickCalAI</h1>
      <p id="lead" class="lead">
        Manage your Google connection and replay the welcome tour.
      </p>

      <p id="status" class="status connecting" role="status" aria-live="polite">
        Checking your QuickCal connection…
      </p>
      <p id="detail" class="detail" hidden></p>
      <button id="connect" type="button" disabled>Connect Google Calendar</button>
      <button id="disconnect" type="button" hidden disabled>Disconnect</button>
      <button id="replay" type="button" disabled>Replay welcome tour</button>

      <section id="ready" hidden>
        <h2>Connection</h2>
        <p>
          Pin QuickCalAI from the Chrome toolbar, then open it on a normal webpage. Disconnect does
          not erase the welcome tour; reconnect when permissions are missing.
        </p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
